name: Process Blog Logs
on:
  repository_dispatch:
    types: [blog_update]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python build_logs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "MIR_OS_BOT"
          git config --global user.email "bot@mir-os.local"
          git add src/data/logs.json
          git commit -m "chore: dynamic log sync [system update]" || echo "No changes to commit"
          git push